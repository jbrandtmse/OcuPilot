#   src/OcuPilot/Test/**   -- the only home for %UnitTest classes in this project (282 files on
#                             feature; Epic 5 alone added 28 across stories 5.0-5.3). Treating it
#                             as Epic 13's exclusive footprint would make Rule 19 IMPOSSIBLE for
#                             every ObjectScript AC in every other epic: the code could be written
#                             but not pinned, which the project's rules treat as worse than not
#                             shipping. Story 13.2's charter is the suite IN CI -- ui/tools/ci*.mjs,
