# Project-local model policy for /epic-cycle.
# Resolution order: this file -> SKILL.md frontmatter -> the command's stage->model map -> inherit.
# Keys are STAGES (plan | implement | qa | code-review), not skills, because bmad-build-auto
# serves two stages at two tiers.
#
# The installer never touches _bmad/custom/, so this survives BMAD upgrades.

stack_risk: uncommon      # ObjectScript / IRIS for Health. Arms the end-of-epic model-tier checkpoint.
review_tier: full-opus    # every bmad-code-review layer stays on the parent (Opus) tier

overrides:
  implement: haiku        # bmad-build-auto's implement stage, moved to Haiku 5.5 on 2026-10-08 as an owner
                          # trial (see history). `plan` and code review stay on opus via the stage map; `qa`
                          # stays on sonnet.

checkpoint:               # pre-answered end-of-epic checkpoint offers (owner instruction 2026-09-16; Rule 23).
  recommend_escalate: decline   # live again while implement is on sonnet: an escalation recommendation never pauses. The lead logs the
                                # checkpoint as usual with answer=pre_answered_decline and leaves overrides alone.
  offer_mixed: decline          # review_tier stays full-opus (the owner refused the mixed offer at Epic 2 too).

history:
  - date: 2026-09-11
    action: escalate-implement-to-opus
    evidence: >-
      Epic 1 cycle log, five cr_complete entries across four stories, implement stage on
      claude-sonnet-5 throughout: Story 1.1 high=1 med=7 (8); Story 1.2 high=1 med=6 (7);
      Story 1.3 high=2 med=8 (10); Story 1.4 round 1 high=5 med=12 (17); Story 1.4 round 2
      high=1 med=6 (7). Mean high+med per story = 9.8 against the checkpoint's escalation
      threshold of 2.0. Story 1.4 additionally took four implement passes (three rework
      iterations, exhausting the cap) while stories 1.1-1.3 took one each. Qualitatively, the
      recurring defect class was a fix applied to one site of several and pinning tests that
      could not fail - four separate vacuous gates across the epic, twice inside tests written
      specifically to pin a previous correction.
    approved_by: user
  - date: 2026-09-16
    action: de-escalate-implement-to-sonnet
    evidence: >-
      Owner decision on cost, not on defect telemetry. Transcript measurement over the 36 hours to
      2026-09-16 (first parallel run, Epics 4 and 6 in flight): 92.8% of weighted token spend on the
      Opus tier; the implement stage 48.8% of all stage-subagent spend, at 110 turns and a context
      growing from 57K to 427K tokens per run. The Epic 2 checkpoint on implement=opus(override)
      recorded unresolved_high_med_mean 0.33. The escalation threshold (unresolved_high_med >= 2
      per story on a Sonnet tier) is still evaluated at every epic close; its offers are pre-answered
      in the checkpoint map above (next entry).
    approved_by: user
  - date: 2026-09-16
    action: pre-answer-checkpoint
    evidence: >-
      Owner instruction: both checkpoint offers are pre-answered decline in the checkpoint map, so
      the 4-12 range runs without a tier pause; evaluation and telemetry continue. Supporting
      telemetry: Epic 3's checkpoint, with implement on opus, measured mean high+med 9.8 per story,
      the same as Epic 1 on sonnet, so the 2026-09-11 escalation did not move that number.
    approved_by: user
  - date: 2026-09-18
    action: re-escalate-implement-to-opus
    evidence: >-
      Owner decision after 1.5 days on sonnet, taken on rework and CI-red counts: implement re-spawned
      1 of 9 opus stories vs 5 of 12 sonnet; CI red after commit 0 of 9 vs 4 of 12; each rework re-runs
      the opus review. Cycle time itself did not differ (corrected 2026-09-19, first commit per story,
      quota pauses excluded): plan spawn to commit median 2.8 h opus vs 3.1 h sonnet, implement stage
      1.4 h vs 1.3 h. The figures first quoted here were inflated by CI-fix commits logged under an
      earlier story's name. Confounded by story mix. The quota cost is accepted for fewer reworks on
      the critical path.
    approved_by: user
  - date: 2026-10-05
    action: de-escalate-implement-to-sonnet
    evidence: >-
      Owner decision on cost, relayed by the Planner session on 2026-10-05 once contest judging was
      essentially done: implement returns to Sonnet (Sonnet 5.5) to conserve tokens. Not taken on
      defect telemetry. QA stays on sonnet and code review on opus, unchanged.
    approved_by: user
  - date: 2026-10-08
    action: move-implement-to-haiku
    evidence: >-
      Owner decision after the harness upgrade, as a trial: "I want to switch the implement model to
      Haiku and see how it does now that it's upgraded to version 5.5. The rest of the steps should
      remain the same." The alias `haiku` resolved to claude-haiku-5-5 when probed on 2026-10-08.
      Plan and code review stay on opus, QA on sonnet; review_tier stays full-opus, so no review
      layer runs below the implementing tier. Telemetry to watch against the Sonnet stories just
      before it (18.9, 18.28, 20.15, 20.18): code-review high+med per story, implement re-spawns,
      first-run CI reds, and Rule 30 fresh-check reds.
    approved_by: user
